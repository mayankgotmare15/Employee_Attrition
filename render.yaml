databases:
  - name: retainiq-db
    databaseName: attrition_db
    user: postgres
    plan: free

services:
  # 1. FastAPI ML Microservice & MLOps Engine
  - type: web
    name: retainiq-ml-service
    runtime: docker
    dockerContext: ./ml-service
    dockerfilePath: ./ml-service/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"

  # 2. Node.js Express API Gateway & Authentication
  - type: web
    name: retainiq-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: retainiq-db
          property: connectionString
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: retainiq-ml-service
          property: host
