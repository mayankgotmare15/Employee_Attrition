name: RetainIQ MLOps CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  ml-service-tests:
    name: ML Microservice & MLOps Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-service/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run ML Microservice Prediction Unit Tests
        run: |
          python -m pytest ml-service/tests/test_service.py -v

      - name: Run MLOps Statistical Drift Engine & PRD TC-04 Retraining Tests
        run: |
          python -m pytest ml-service/tests/test_mlops.py -v

  backend-tests:
    name: Backend API Gateway & RBAC Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: attrition_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client & Migrate Schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/attrition_test_db?schema=public
        run: |
          npx prisma db push
          node prisma/seed.js

      - name: Run Node.js API Integration Tests
        working-directory: backend
        env:
          PORT: 5000
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/attrition_test_db?schema=public
          JWT_SECRET: test_jwt_secret_token_retainiq_2026
          ML_SERVICE_URL: http://127.0.0.1:8000
        run: |
          node test/api_test.js

  frontend-build:
    name: React Frontend Build & Asset Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React Production Bundle
        working-directory: frontend
        run: npm run build

      - name: Verify Distribution Artifacts
        working-directory: frontend
        run: |
          test -f dist/index.html || exit 1
          echo "Production build verified successfully with optimized assets."
