version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: attrition-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: attrition_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: attrition-ml-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attrition-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/attrition_db?schema=public
      - JWT_SECRET=attrition_prediction_super_secret_jwt_2026
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      - postgres
      - ml-service

volumes:
  pgdata:
